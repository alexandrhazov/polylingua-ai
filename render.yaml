services:
  - type: web
    name: polylingua-ai
    runtime: python
    plan: free
    # Frankfurt (and other EU/UK/Switzerland regions) are blocked by Google's
    # Gemini Developer API ("User location is not supported"). Oregon avoids
    # that restriction while keeping the free API key (no Vertex AI/billing
    # needed). Region can't be changed on an existing service — recreate it.
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false          # set in the Render dashboard (from @BotFather)
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard
      - key: DATABASE_URL
        sync: false          # set in the Render dashboard: use a restricted DML-only
                              # role's connection string (see README), not the DB owner role
      - key: WEBHOOK_URL
        sync: false          # e.g. https://polylingua-ai.onrender.com
      - key: WEBHOOK_SECRET
        generateValue: true  # Render generates a random secret token
